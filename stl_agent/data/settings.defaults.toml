# Built-in defaults for every setting. Don't edit this file to change a setting: edit settings.toml in
# the project root instead (created on first run as a copy of this file with every line commented out).
# Adding a setting: add it here with a comment, and to the schema in stl_agent/config.py.

# LLM provider for builds and the intake gate: "anthropic", "gemini" or "ollama" (local, no key).
provider = "anthropic"

# Generation + repair attempts per build. Each attempt is one LLM request.
max_attempts = 4

# When a script fails, also tell the model which CadQuery calls in it are wrong and their real signatures
# (read from the installed CadQuery), not only the error. Off until a benchmark shows a gain: on a 12-case
# local-model run (rag vs rag-hints in eval/results/), it gave no more correct parts.
api_hints = false

# Repair message when a part fails only the size check (#23). The check compares the part with the model's own
# BBOX estimate, so either can be wrong. "measured": say so, with the part's measured size, and let the model
# decide; "ask": the same without the measured size (fewer wrong-size parts get through, but fewer correct ones
# too); "fix": the general "fix the script" message used before #23. See eval/results/size-check.md.
size_feedback = "measured"

# Examples from the few-shot library put in each prompt (RAG). 0 for none.
top_k = 3

# How those examples are found: "tfidf" (words) or "tfidf-char" (letter chunks, numbers stripped).
retriever = "tfidf"

# Intake gate run before generation: "llm", "off" (always build), or "jev" (not implemented yet, #12).
gate = "llm"

# Clarifying rounds the gate may ask before building on assumptions.
gate_max_rounds = 2

# Let the gate pick the RAG examples from a library index (not yet tested on all requests, #20).
gate_picks = false

# Thingiverse models shown when a request can't be built with code (#9). Needs THINGIVERSE_TOKEN in .env.
thingiverse_results = 6

# Who picks downloaded Thingiverse models: "manual" (the user, from a gallery) or "auto". Applies to a single
# sculpted part (#9; auto takes the first result that downloads) and to each downloaded piece of a combined
# part (#10; auto takes the first result that allows derivatives and downloads).
thingiverse_pick = "manual"

# Organic or sculpted objects (an animal, a figurine) and organic pieces of combined parts: "thingiverse"
# (download an existing model, as above) or "sdf" (sculpt it from rounded shapes in code, #42; experimental;
# needs no Thingiverse token, and falls back to Thingiverse if the build fails).
organic_builder = "thingiverse"

# Visual judge for evaluation (#8, eval/judge.py only): "llm".
judge = "llm"

# Provider for the judge. Unset: the build provider.
# judge_provider = "gemini"

# Score (0-1) at which a judged part passes. From `judge calibrate` (prompt v2, render v2).
judge_threshold = 0.5

# Per-provider settings. API keys never go here: put them in .env.
#   base_url      API address
#   model         model for builds
#   gate_model    model for the intake gate (unset: model)
#   judge_model   model for the visual judge (unset: model)
#   rpm           max requests per minute per model (unset: no limit)
#   timeout       seconds to wait for one reply (unset: 300)

[providers.anthropic]
# Claude. Needs ANTHROPIC_API_KEY in .env.
# base_url = "https://api.anthropic.com"
model = "claude-sonnet-5-5"
# gate_model = "claude-haiku-5-5"
# judge_model = "claude-sonnet-5-5"
# rpm = 50
# timeout = 300

[providers.gemini]
# Google Gemini, free tier. Needs GEMINI_API_KEY in .env (free key: aistudio.google.com).
# About 20 requests/day per model; each model has its own quota.
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
model = "gemini-3.8-flash"
# Set gate_model to another model to give gate checks their own daily quota, so they don't use up builds.
# gate_model = "gemini-3.8-flash"
# Judges benchmark renders: a different model from 3.5 Flash Lite, which built most parts.
judge_model = "gemini-3.1-flash-lite"
# The free tier allows 15/minute, but Google counted 14 sent as up to 17; keep a wide margin.
rpm = 10
# timeout = 300

[providers.ollama]
# Local models served by Ollama (ollama.com). No key; nothing leaves the machine.
# Ollama's server defaults to a 4096-token context and silently drops the start of longer prompts;
# raise it with OLLAMA_CONTEXT_LENGTH on the Ollama service.
base_url = "http://localhost:11434/v1"
# gemma4:12b (7.7 GB, fits a 10 GB GPU with a 16K context) built 60% of a 12-case benchmark subset, against
# 43% for ornith:9b and 25% for qwen3.5:9b (eval/results/<model>.jsonl).
model = "gemma4:12b"
# gate_model = "gemma4:12b"
# judge_model = "gemma4:12b"
# rpm = 60
# A reply that never stops runs until it fills the context, which on a 10 GB GPU can take over 5 minutes.
# Local requests cost nothing, so wait for it rather than abandon the request.
timeout = 600
