[workspace]
authors = ["mclaager <michael@laager.me>"]
channels = ["conda-forge"]
name = "stl_agent"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]

[feature.cap6938.system-requirements]
libc = "2.35"

[feature.cap6938.pypi-dependencies]
cadquery = ">=2.4"
trimesh = ">=4.0"
numpy = "*"
scikit-learn = "*"
anthropic = "*"
gradio = ">=4.0"
pytest = ">=9.1.1, <10"
networkx = ">=3.7, <4"  # trimesh mesh.split (connected bodies in sandbox.validate_mesh)
vtk = "*"  # offscreen rendering for the judge (already a CadQuery dependency)
pillow = "*"
manifold3d = ">=3.0"  # boolean union when combining pieces (#10)
httpx = "*"  # Gemini/Ollama client and Thingiverse (already a Gradio dependency)

[feature.cap6938.tasks]
app = "python -m stl_agent.app"
examples = "python -m scripts.make_examples"
sdf-examples = "python -m scripts.make_sdf_examples"
test = "python -m pytest -q"
bench = "python -m eval.bench"
judge = "python -m eval.judge"
retrieval-eval = "python -m eval.retrieval"
references = "python -m eval.references"
gate-specs = "python -m eval.gate_specs"
size-check = "python -m eval.size_check"
settings = "python -m stl_agent.config"
ft-requests = "python -m finetune.make_requests"
ft-collect = "python -m finetune.collect"
ft-export = "python -m finetune.export"

[feature.cap6938.dependencies]
python = "3.12.*"

# Fine-tuning (#46): PyTorch + Unsloth on an NVIDIA GPU. Its own environment, so the app stays PyTorch-free (#19).
[feature.finetune.system-requirements]
libc = "2.35"
cuda = "12"

[feature.finetune.dependencies]
python = "3.12.*"

[feature.finetune.pypi-dependencies]
unsloth = ">=2026.10"
torch = ">=2.10, <2.15"  # unsloth 2026.10 needs < 2.15
# The public fogleman/sdf (MIT), only to check that SDF training scripts run on it unchanged (#46,
# finetune/fogleman_check.py). Not on PyPI; pinned to the commit that was compared with stl_agent/sdf.py.
sdf = { git = "https://github.com/fogleman/sdf", rev = "d58a6fc63b75fc1cf1ebb71e0b42bf552319c8f1" }

[feature.finetune.tasks]
ft-train = "python -m finetune.train"
ft-fogleman = "python -m finetune.fogleman_check"

[environments]
cap6938 = { features = ["cap6938"], no-default-feature = true }
finetune = { features = ["finetune"], no-default-feature = true }
