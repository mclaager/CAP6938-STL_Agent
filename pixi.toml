[workspace]
authors = ["mclaager <michael@laager.me>"]
channels = ["conda-forge"]
name = "stl_agent"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]

[feature.cap6938.system-requirements]
libc = "2.35"

[feature.cap6938.pypi-dependencies]
cadquery = ">=2.4"
trimesh = ">=4.0"
numpy = "*"
scikit-learn = "*"
anthropic = "*"
gradio = ">=4.0"
pytest = ">=9.1.1, <10"
networkx = ">=3.7, <4"  # trimesh mesh.split (connected bodies in sandbox.validate_mesh)
vtk = "*"  # offscreen rendering for the judge (already a CadQuery dependency)
pillow = "*"
manifold3d = ">=3.0"  # boolean union when combining pieces (#10)
httpx = "*"  # Gemini/Ollama client and Thingiverse (already a Gradio dependency)

[feature.cap6938.tasks]
app = "python -m stl_agent.app"
examples = "python -m scripts.make_examples"
test = "python -m pytest -q"
bench = "python -m eval.bench"
judge = "python -m eval.judge"
retrieval-eval = "python -m eval.retrieval"
references = "python -m eval.references"
gate-specs = "python -m eval.gate_specs"
size-check = "python -m eval.size_check"
settings = "python -m stl_agent.config"

[feature.cap6938.dependencies]
python = "3.12.*"

[environments]
cap6938 = { features = ["cap6938"], no-default-feature = true }
